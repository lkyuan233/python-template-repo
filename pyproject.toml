[project]
name = "python-template-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pytest>=8.3.5",
    "pytest-cov",
    "ruff",
    "mypy",
    "requests",
    "python-dotenv",
    "google-generativeai",
    "google-api-python-client>=2.113.0", # Updated from mail_gmail_impl (2.113.0 is lower than 2.167.0 you had — keeping your version)
    "google-auth>=2.28.1",
    "google-auth-oauthlib>=1.2.2",
    "google-auth-httplib2>=0.1.1",       # Added from mail_gmail_impl
    "oauth2client>=4.1.3",
    "html2text>=2023.0.0",
]

[tool.ruff]
line-length = 100
exclude = ["tests/snapshots"]

[tool.mypy]
strict = true

[dependency-groups]
dev = ["types-requests>=2.32.0.20250328"]
